# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
# Gradle daemon 需在 JDK 21 上运行（Kotlin 1.9 + AGP 8.5 在 JDK 22+ 上不兼容，
# 尤其是 Kotlin 的 JavaVersion.parse 无法识别 JDK 25 三段版本号导致 IllegalArgumentException）。
# CI 由 actions/setup-java 设置 JAVA_HOME=21；本地构建请确保 JAVA_HOME 指向 JDK 21
# （例：JAVA_HOME=/path/to/jdk21 ./gradlew ...），不要在此硬编码机器相关绝对路径以免破坏 CI。
org.gradle.java.installations.auto-download=false

