# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
# 编译目标固定 JDK 21（Kotlin 1.9 + AGP 8.5 在 JDK 22+ 上可能不兼容，
# 尤其是 Kotlin 的 JavaVersion.parse 无法识别 JDK 25 三段版本号导致 IllegalArgumentException）。
# AGP/kotlinc 用 toolchain 从本地已安装版本中自动选 JDK 21，不会影响 CI 运行 gradle 本身的 JDK。
org.gradle.java.installations.auto-download=false

