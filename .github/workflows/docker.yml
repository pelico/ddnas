name: build-docker

# 构建 DDNAS 中间件 Docker 镜像，多架构（amd64 / arm64 / armv7）。
# 采用「矩阵 + Go 原生交叉编译」：每个架构在独立的 buildx 调用里构建，
# 构建阶段固定 BUILDPLATFORM（原生 amd64）交叉编译，不依赖 QEMU、
# 不跨架构共享 GHA 缓存，彻底避免 arm/v7 镜像里被装入 amd64 二进制的问题。
# 三张单架构镜像分别推送为 *-amd64/*-arm64/*-armv7，再由 manifest 作业合并成多架构清单。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'middleware/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
            archtag: amd64
          - goarch: arm64
            platform: linux/arm64
            archtag: arm64
          - goarch: arm
            goarm: "7"
            platform: linux/arm/v7
            archtag: armv7
    steps:
      - uses: actions/checkout@v4

      # 最终镜像阶段（alpine armv7）的 RUN apk/adduser 仍需 QEMU 模拟；
      # 构建阶段已用 --platform=$BUILDPLATFORM 固定在原生 amd64，不走 QEMU。
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          repo="ghcr.io/${{ github.repository }}"
          echo "archtag=$repo:latest-${{ matrix.archtag }}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME}"
            echo "verarchtag=$repo:${v}-${{ matrix.archtag }}" >> "$GITHUB_OUTPUT"
          else
            echo "verarchtag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: middleware
          file: middleware/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # 双保险：不依赖 buildx 隐式注入 TARGETARCH/TARGETVARIANT，
          # 显式把矩阵值塞进 ARG，确保 build 阶段 GOARCH 真的是目标架构。
          build-args: |
            TARGETARCH=${{ matrix.goarch }}
            TARGETVARIANT=${{ matrix.goarm != '' && format('v{0}', matrix.goarm) || '' }}
          tags: |
            ${{ steps.tags.outputs.archtag }}
            ${{ steps.tags.outputs.verarchtag }}
          # 每个架构独立的 GHA 缓存命名空间，杜绝跨架构缓存命中
          cache-from: type=gha,scope=${{ matrix.archtag }}
          cache-to: type=gha,scope=${{ matrix.archtag }},mode=max
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest
    # 仅当三个架构全部构建成功才合并清单，避免 latest 缺 armv7 导致 armv7l 拉取报错
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute manifest sources and targets
        id: m
        run: |
          repo="ghcr.io/${{ github.repository }}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "sources=$repo:latest-amd64 $repo:latest-arm64 $repo:latest-armv7" >> "$GITHUB_OUTPUT"
            echo "targets=$repo:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME}"
            major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
            echo "sources=$repo:${v}-amd64 $repo:${v}-arm64 $repo:${v}-armv7" >> "$GITHUB_OUTPUT"
            echo "targets=$repo:${v} $repo:${major}.${minor}" >> "$GITHUB_OUTPUT"
          else
            echo "sources=" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest list
        if: steps.m.outputs.targets != ''
        run: |
          # buildx imagetools create 把三张单架构镜像合并成一张多架构清单；
          # 多个 --tag 对应多个目标标签（latest / 版本号 / major.minor）。
          args=()
          for t in ${{ steps.m.outputs.targets }}; do
            args+=(--tag "$t")
          done
          docker buildx imagetools create "${args[@]}" ${{ steps.m.outputs.sources }}

  # 仅 tag 触发：把已推 GHCR 的三个单架构镜像 export 为 tar.gz，
  # 附到 GitHub Release（amd64 / arm64 / armv7 各一份），
  # 方便不联网/本地导入/ARM 单板用户直接 docker load 部署。
  release-tar:
    needs: manifest
    if: ${{ !cancelled() && needs.manifest.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 三个架构并行导出：每个拉镜像 -> save 成 tar -> gzip 压缩，
      # 命名 ddnas_<version>_linux_<arch>.tar.gz
      - name: Export linux/amd64 image to tar.gz
        run: |
          set -eux
          ver="${GITHUB_REF_NAME}"
          img="ghcr.io/${{ github.repository }}:${ver}-amd64"
          docker pull "$img"
          mkdir -p out
          docker save -o "out/ddnas_${ver}_linux_amd64.tar" "$img"
          gzip -9 -f "out/ddnas_${ver}_linux_amd64.tar"
          ls -lh out/

      - name: Export linux/arm64 image to tar.gz
        run: |
          set -eux
          ver="${GITHUB_REF_NAME}"
          img="ghcr.io/${{ github.repository }}:${ver}-arm64"
          docker pull "$img"
          mkdir -p out
          docker save -o "out/ddnas_${ver}_linux_arm64.tar" "$img"
          gzip -9 -f "out/ddnas_${ver}_linux_arm64.tar"
          ls -lh out/

      - name: Export linux/arm/v7 image to tar.gz
        run: |
          set -eux
          ver="${GITHUB_REF_NAME}"
          img="ghcr.io/${{ github.repository }}:${ver}-armv7"
          docker pull "$img"
          mkdir -p out
          docker save -o "out/ddnas_${ver}_linux_armv7.tar" "$img"
          gzip -9 -f "out/ddnas_${ver}_linux_armv7.tar"
          ls -lh out/

      - name: Upload tarballs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddnas-docker-tarballs
          path: out/*.tar.gz
          if-no-files-found: error

      - name: Attach tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
          # release notes 由 android.yml 的同名 job 生成（同 tag），这里只追加文件
          generate_release_notes: false
